spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: corsi-service
          uri: http://localhost:8080  # Sostituisci con l'URL effettivo del tuo servizio
          predicates:
            - Path=/api/corsi/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/corsi/(?<segment>.*), /corsi/$\{segment}

server:
  port: 9090