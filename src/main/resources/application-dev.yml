server:
  port: 9090

spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:postgresql://localhost:5433/corsiDB
    username: postgres
    password: Argolone92!
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: DOCENTI
              uri: http://localhost:8080
              predicates:
                - Path=/docenti/**
            - id: DISCENTI
              uri: http://localhost:8080
              predicates:
                - Path=/discenti/**
            - id: CORSI
              uri: http://localhost:8081
              predicates:
                - Path=/corsi/**

jwt:
  secret: mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong
  expiration: 86400000 # 24 ore in millisecondi